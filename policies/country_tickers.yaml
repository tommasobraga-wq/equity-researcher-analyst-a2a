# Country reference map — same role as policies/sector_tickers.yaml but keyed
# by issuer domicile (yfinance `country`, matched by shared/eligibility.py::
# check_country_scope) instead of sector. Used by shared/country_seed.py's
# load_country_seed_tickers() as the fallback candidate pool when, in
# "discovery" mode, the user explicitly requested a country/market and
# NewsSentiment's generic RSS scan (all US/international sources, no
# country-specific feed) found no candidates domiciled there — a second
# NewsSentiment call targets `tickers` below via the same per-ticker
# read_ticker_news lookup already used in "specific" mode. Always surfaced to
# the user via nota_metodologica in the final report — never silent.
#
# Not exhaustive by design, same posture as sector_tickers.yaml: the country
# name is free text extracted by the coordinator from the user's prompt. If a
# requested country has no matching entry here, no fallback is attempted.
#
# Key must match yfinance's `country` field value used by
# shared/eligibility.py::_ALLOWED_COUNTRIES (English name, e.g. "Italy").
#
# Scope: the 5 largest EU-27 equity markets (Italy already existing, plus
# Germany/France/Spain/Netherlands/Belgium) — deliberately not all 27, since
# large-economy issuers already have some chance of surfacing in the generic
# US/international RSS scan, while the smallest EU markets (Baltics, Balkans,
# Malta, Cyprus...) are the ones most exposed to zero coverage; those are left
# for when actually requested, rather than guessed at speculatively.
#
# Every ticker below was verified against yfinance's own `country` field
# (not just index membership) before inclusion — several well-known index
# constituents are legally domiciled in a DIFFERENT country than where they
# are best known/headquartered (e.g. Airbus, Stellantis, STMicroelectronics,
# ArcelorMittal, argenx are all Netherlands-domiciled N.V.s regardless of
# listing venue; Ferrovial redomiciled to the Netherlands in 2023; Tenaris
# and Eurofins Scientific are Luxembourg-domiciled), so a naive "index
# constituent" list would put tickers in the wrong bucket and have Gate 1's
# check_country_scope reject them for the very country their index suggests.
# Index composition also changes periodically (quarterly review) — this list
# may drift from the live index over time and needs occasional manual refresh.

