# Sector reference map — used by TWO deterministic mechanisms in
# shared/sector_seed.py:
#
# 1. Fallback seed tickers (load_sector_seed_tickers): when, in "discovery"
#    mode, the user explicitly requested a sector and NewsSentiment's generic
#    RSS scan found no candidates for it, a second NewsSentiment call targets
#    `tickers` below via the same per-ticker read_ticker_news lookup already
#    used in "specific" mode — a real, fresh search, just company-scoped
#    instead of headline-scoped. Always surfaced to the user via
#    nota_metodologica in the final report — never silent.
#
# 2. Keyword expansion for Gate 1's sector-scope check
#    (shared.eligibility.check_sector_scope): the user's free-text sector
#    ("automotive") often does not literally appear in yfinance's own
#    sector/industry taxonomy (e.g. Tesla is sector="Consumer Cyclical",
#    industry="Auto Manufacturers" — "automotive" is a substring of neither).
#    `keywords` bridges that gap so a real match isn't rejected as
#    out-of-scope.
#
# Not exhaustive by design: the sector name is free text extracted by the
# coordinator from the user's prompt. If a requested sector has no matching
# entry here, no fallback is attempted and Gate 1 falls back to a literal
# match on the requested text — the pipeline reports the gap honestly
# instead of guessing either way.
#
# All tickers are US/EU-27 issuers per the domain's market perimeter
# (UK/Switzerland/other excluded) — Gate 1's check_market_perimeter still
# re-verifies this by issuer domicile regardless, as it does for every
# candidate from any source.

automotive:
  keywords: [auto, automotive, vehicle, car]
  tickers: [TSLA, F, GM, STLA, VOW3.DE]

